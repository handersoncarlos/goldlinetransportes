<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Goldline Transportes</title>
<meta name="description" content="A página que você procurou não existe ou mudou de endereço. Volte para a página inicial da Goldline Transportes e solicite a sua cotação de frete.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Página independente com caminhos absolutos: funciona em qualquer URL inexistente -->
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-var-latin.woff2') format('woff2');font-weight:500 900;font-stretch:62% 100%;font-display:swap}
@font-face{font-family:'Montserrat';src:url('/fonts/montserrat-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Montserrat';src:url('/fonts/montserrat-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--gold:#E5BE55;--gold-hover:#F0CD6C;--ink:#1A1A1A;--muted:#BDBDBD}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--ink);color:#E9E9E9;font-family:'Montserrat',Arial,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
header{padding:20px;border-bottom:1px solid rgba(229,190,85,.18)}
header img{height:38px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;padding:64px 20px}
.in{max-width:720px;margin:0 auto;width:100%;position:relative;z-index:1}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Archivo','Arial Narrow',Arial,sans-serif;font-weight:800;font-stretch:72%;text-transform:uppercase;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;color:#fff;margin:.8rem 0 1rem}
h1 span{color:var(--gold)}
p{color:var(--muted);max-width:560px;margin-bottom:2rem}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:13px 26px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none}
a.btn:hover{background:var(--gold-hover)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.c{position:absolute;right:-160px;bottom:-200px;width:560px;height:560px;border:1.5px solid rgba(229,190,85,.3);border-radius:50%}
</style>
</head>
<body>
<header><a href="/" aria-label="Goldline Transportes, início"><img src="/img/logo-goldline.webp" alt="Goldline Transportes" width="157" height="38"></a></header>
<main>
  <div class="c" aria-hidden="true"></div>
  <div class="in">
    <p class="eyebrow">Erro 404</p>
    <h1>Página <span>não encontrada</span></h1>
    <p>O endereço que você acessou não existe ou mudou de lugar.</p>
    <a class="btn" href="/">Ir para a página inicial</a>
  </div>
</main>
</body>
</html>
